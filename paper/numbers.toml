# Every number cited in the paper's prose (spec task 8.3).
# One [[n]] per LaTeX macro: name (letters only), src (repo-relative JSON),
# path (keys / list indices), fmt (str.format), optional scale, minus, len.
# Regenerate paper/numbers.tex with scripts/paper_numbers.py.

[check]
# Literal strings allowed in prose: definitions and protocol constants that are
# not results. Keep this short.
allow = [
  # Ranges first: the "95%" entry below would otherwise eat half of "5--95%".
  "25--75\\%",
  "1--99\\%",
  "5--95\\%",
  "\\vskip 0.3in",
  "\\setcounter{table}{0}",
  "\\setcounter{figure}{0}",
  "3-of-5",
  "2-of-3",
  "5-of-5",
  # The alpha grid of the sensitivity runs: a protocol constant.
  "from 1\\% to 10\\%",
  "3 of 5",
  "F_1",
  "1-\\alpha",
  "1 + m(t)",
  "H_0",
  "H_1",
  "95\\%",
  "90\\%",
  "SHA-256",
  "L1",
  "L2",
  "R1",
  "^{-1}",
  "0 & \\text{otherwise}",
  "$s_C^{\\mathrm{dev}} = 0$",
  "$s_C^{\\mathrm{rep}} = 0$",
  "S_{t-1}",
  "S_0 = 0",
  "\\max(0,",
  # Figures cited from other papers in the introduction, not our results.
  "97\\%",
  "98\\%",
  "48--88\\%",
  "43\\%",
  "96\\%",
  "a 1\\% false-alarm rate",
  # Feature names, plot ranges and axis limits in captions.
  "\\texttt{env\\_frac\\_150\\_250hz}",
  "\\texttt{env\\_p99\\_over\\_p50}",
  "\\texttt{env\\_ac\\_lag1}",
  "10^{-3}",
]

